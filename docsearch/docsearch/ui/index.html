<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocSearch</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1f23; --muted: #646a73; --line: #dcdad3;
  --accent: #1f5fa8; --accent-ink: #ffffff; --ok: #1d6b3a; --ok-bg: #e4f2e8;
  --warn: #8a5a00; --warn-bg: #fbf0d4; --bad: #9b2c2c; --bad-bg: #f9e3e1; --mark: #ffe680;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17191c; --panel: #202327; --ink: #e8e8e6; --muted: #9aa1ab; --line: #343940;
    --accent: #6ea8e6; --accent-ink: #10141a; --ok: #7fd09a; --ok-bg: #1c3325;
    --warn: #e6bf6a; --warn-bg: #3a2f14; --bad: #f09a94; --bad-bg: #3d1f1e; --mark: #6b5a00;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 20px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
nav { display: flex; gap: 4px; }
nav button { background: none; border: 0; color: var(--muted); padding: 7px 12px; border-radius: 6px; font: inherit; cursor: pointer; }
nav button.on { background: var(--bg); color: var(--ink); font-weight: 600; }
#pill { margin-left: auto; font-size: 13px; color: var(--muted); }
main { max-width: 980px; margin: 0 auto; padding: 22px 16px 60px; }
section { display: none; } section.on { display: block; }
h2 { font-size: 15px; margin: 26px 0 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
input[type=text], input[type=number], select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
button.btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.btn.small { padding: 3px 9px; font-size: 13px; }
button:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 200px; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.verdict { border-radius: 10px; padding: 12px 16px; margin: 16px 0 8px; font-weight: 600; }
.verdict.answer { background: var(--ok-bg); color: var(--ok); }
.verdict.passages { background: var(--warn-bg); color: var(--warn); }
.verdict.not_found { background: var(--bad-bg); color: var(--bad); }
.verdict small { display: block; font-weight: 400; margin-top: 2px; }
.stmt { margin: 8px 0; font-size: 16px; }
.stmt q { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.cite { display: inline-block; min-width: 20px; text-align: center; background: var(--accent); color: var(--accent-ink); border-radius: 5px; font-size: 12px; font-weight: 700; padding: 0 5px; margin-left: 4px; cursor: pointer; text-decoration: none; }
.notice { font-size: 13px; color: var(--warn); margin: 4px 0; }
.src-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.src-head b { font-size: 15px; }
.badge { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 6px; text-transform: uppercase; letter-spacing: .3px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.badge.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.badge.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.src-text { white-space: pre-wrap; margin: 10px 0; padding: 10px 12px; background: var(--bg); border-radius: 8px; font-size: 14px; overflow-wrap: anywhere; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }
.pageimg { max-width: 100%; border: 1px solid var(--line); border-radius: 6px; margin-top: 8px; background: #fff; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td:first-child { overflow-wrap: anywhere; } td .btn { white-space: nowrap; }
th { color: var(--muted); font-weight: 600; }
.bar { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin: 8px 0; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.stat { background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.stat b { display: block; font-size: 18px; }
.field { display: grid; grid-template-columns: 240px 1fr; gap: 6px 14px; align-items: center; margin: 8px 0; }
.field small { grid-column: 2; color: var(--muted); }
@media (max-width: 640px) { .field { grid-template-columns: 1fr; } .field small { grid-column: 1; } }
</style>
</head>
<body>
<header>
  <h1>DocSearch</h1>
  <nav>
    <button data-tab="ask" class="on">Ask</button>
    <button data-tab="library">Library</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <span id="pill"></span>
</header>
<main>

<section id="ask" class="on">
  <form id="askform" class="row">
    <input type="text" id="question" class="grow" placeholder="Ask about an SOP, circular or instruction…" autofocus>
    <button class="btn primary" id="askbtn">Ask</button>
  </form>
  <label class="small muted"><input type="checkbox" id="incsup"> Include superseded documents</label>
  <div id="result"></div>
</section>

<section id="library">
  <div class="card">
    <div class="row">
      <input type="text" id="folderpath" class="grow" placeholder="Folder containing your documents">
      <button class="btn" id="pickbtn" hidden>Browse…</button>
      <button class="btn" id="addfolder">Add folder</button>
    </div>
    <div id="folders" class="small" style="margin-top:8px"></div>
  </div>
  <div class="card">
    <div class="row">
      <button class="btn primary" id="startbtn">Read documents</button>
      <button class="btn" id="stopbtn">Pause</button>
      <button class="btn" id="retrybtn">Retry failed</button>
      <span id="ingestline" class="small muted"></span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="stats" id="stats"></div>
  </div>
  <h2>Documents</h2>
  <div class="row">
    <input type="text" id="docq" class="grow" placeholder="Filter by name, title or number">
    <select id="docstate">
      <option value="">All</option><option value="done">Indexed</option><option value="pending">Waiting</option>
      <option value="error">Failed</option><option value="duplicate">Duplicates</option>
      <option value="unsupported">Unsupported type</option><option value="superseded">Superseded</option>
      <option value="lowconf">Hard-to-read scans</option>
    </select>
  </div>
  <div class="card" style="padding:4px 8px"><table id="doctable"></table><div id="docmore" class="small muted" style="padding:8px"></div></div>
  <h2>Pages to review</h2>
  <p class="small muted">Scanned pages the OCR could not read confidently. Answers that rely on them carry a warning.</p>
  <div class="card" style="padding:4px 8px"><table id="reviewtable"></table></div>
</section>

<section id="settings">
  <h2>Models</h2>
  <div class="card">
    <table id="modeltable"></table>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="dlbtn">Download models</button>
      <span id="dlline" class="small muted"></span>
    </div>
    <p class="small muted">Downloading needs internet once. For a PC without internet, copy the <code>models</code> folder from a PC that has them into the data folder shown below.</p>
  </div>
  <h2>Behaviour</h2>
  <div class="card" id="settingsform"></div>
  <div class="row"><button class="btn primary" id="savebtn">Save settings</button><span id="saveline" class="small muted"></span></div>
  <p class="small muted" id="homeline"></p>
</section>

</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || "Request failed");
  return data;
}

// ---------------------------------------------------------------- tabs
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("nav button, section").forEach((e) => e.classList.remove("on"));
  b.classList.add("on"); $(b.dataset.tab).classList.add("on");
  if (b.dataset.tab === "library") { loadDocs(); loadReview(); }
  if (b.dataset.tab === "settings") loadSettings();
});

// ---------------------------------------------------------------- ask
const VERDICT = {
  answer: ["Answer verified against the documents", "Every statement below was checked against the passage it cites."],
  passages: ["Matching passages from the documents", "This is the exact document text, not a generated answer."],
  not_found: ["Not found in the documents", "Nothing in the indexed documents answers this confidently."],
};
function highlight(text, sentence) {
  const t = esc(text);
  if (!sentence) return t;
  const words = sentence.split(/\s+/).map((w) => esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  try { return t.replace(new RegExp(words.join("\\s+")), (m) => "<mark>" + m + "</mark>"); } catch { return t; }
}
function sourceCard(s, weak) {
  const meta = [s.doc_type, s.doc_number, s.issue_date && "dated " + s.issue_date, "page " + s.page_start + (s.page_end > s.page_start ? "–" + s.page_end : "")].filter(Boolean).map(esc).join(" · ");
  const badges = [
    s.superseded && '<span class="badge bad">Superseded</span>',
    s.scanned && '<span class="badge">Scanned</span>',
    s.low_conf && '<span class="badge warn">Hard to read (' + Math.round(s.ocr_conf * 100) + '%)</span>',
    s.table && '<span class="badge warn">Table</span>',
  ].filter(Boolean).join(" ");
  const img = "/api/page-image?doc_id=" + s.doc_id + "&page=" + s.page_start + "&chunk_id=" + s.chunk_id;
  const hasImage = /\.(pdf|png|jpe?g|tiff?|bmp|webp)$/i.test(s.file);
  return '<div class="card" id="src' + (weak ? "w" : "") + s.n + '">' +
    '<div class="src-head">' + (weak ? "" : '<span class="cite">' + s.n + "</span>") + "<b>" + esc(s.title || s.file) + "</b> " + badges + "</div>" +
    '<div class="small muted">' + meta + " · " + esc(s.file) + "</div>" +
    '<div class="small muted">' + esc(s.heading) + "</div>" +
    '<div class="src-text">' + highlight(s.text, s.highlight) + "</div>" +
    '<div class="row">' +
    (hasImage ? '<button class="btn small" data-img="' + esc(img) + '">' + (s.scanned ? "Hide page" : "Show page") + "</button>" : "") +
    '<button class="btn small" data-open="' + s.doc_id + '">Open file</button>' +
    '<span class="small muted">relevance ' + s.score.toFixed(2) + "</span></div>" +
    (hasImage && s.scanned ? '<img class="pageimg" loading="lazy" src="' + esc(img) + '" alt="Page image">' : "") +
    "</div>";
}
function renderResult(r) {
  const [title, sub] = VERDICT[r.mode];
  let h = '<div class="verdict ' + r.mode + '">' + title + "<small>" + sub + "</small></div>";
  for (const st of r.statements) {
    h += '<div class="stmt">' + esc(st.text) + '<a class="cite" href="#src' + st.source + '">' + st.source + "</a><q>" + esc(st.quote) + "</q></div>";
  }
  for (const n of r.notices) h += '<div class="notice">' + esc(n) + "</div>";
  if (r.sources.length) h += "<h2>Sources</h2>" + r.sources.map((s) => sourceCard(s, false)).join("");
  if (r.related.length) h += "<h2>Closest passages (may not be relevant)</h2>" + r.related.map((s) => sourceCard(s, true)).join("");
  $("result").innerHTML = h;
}
$("askform").onsubmit = async (e) => {
  e.preventDefault();
  const q = $("question").value.trim();
  if (!q) return;
  $("askbtn").disabled = true;
  $("result").innerHTML = '<p class="muted">Searching the documents…</p>';
  try { renderResult(await api("/api/ask", { question: q, include_superseded: $("incsup").checked || null })); }
  catch (err) { $("result").innerHTML = '<div class="verdict not_found">' + esc(err.message) + "</div>"; }
  $("askbtn").disabled = false;
};
$("result").onclick = async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.open) { try { await api("/api/documents/" + b.dataset.open + "/open", {}); } catch (err) { alert(err.message); } }
  if (b.dataset.img) {
    const card = b.closest(".card"); const old = card.querySelector(".pageimg");
    if (old) { old.remove(); b.textContent = "Show page"; return; }
    const im = new Image(); im.className = "pageimg"; im.alt = "Page image"; im.src = b.dataset.img;
    im.onerror = () => { im.replaceWith(Object.assign(document.createElement("div"), { className: "notice", textContent: "The original file could not be opened." })); };
    card.appendChild(im); b.textContent = "Hide page";
  }
};

// ---------------------------------------------------------------- status
let lastStatus = null;
async function refresh() {
  let s; try { s = await api("/api/status"); } catch { return; }
  lastStatus = s;
  const c = s.counts, d = c.documents, ing = s.ingest;
  $("pill").textContent = (d.done || 0) + " documents · " + c.passages + " passages" + (ing.running ? " · reading…" : "");
  $("folders").innerHTML = s.folders.length ? s.folders.map((f) => "<div>" + esc(f) + ' <button class="btn small" data-rm="' + esc(f) + '">Remove</button></div>').join("") : '<span class="muted">No folders added yet.</span>';
  const pct = ing.docs_total ? Math.round(100 * (ing.docs_done + (ing.pages ? ing.page / ing.pages : 0)) / ing.docs_total) : 0;
  $("bar").style.width = (ing.running ? Math.min(pct, 100) : 0) + "%";
  $("ingestline").textContent = ing.running
    ? ing.phase + " · " + ing.docs_done + "/" + ing.docs_total + " files · " + ing.file + (ing.pages > 1 ? " (page " + ing.page + "/" + ing.pages + ")" : "") + (ing.pages_per_min ? " · " + ing.pages_per_min + " pages/min" : "")
    : (ing.last_error ? "Last problem: " + ing.last_error : (d.pending ? d.pending + " files waiting" : "Up to date"));
  $("startbtn").disabled = ing.running; $("stopbtn").disabled = !ing.running; $("retrybtn").disabled = ing.running || !d.error;
  const stat = (n, l) => '<div class="stat"><b>' + n + "</b>" + l + "</div>";
  $("stats").innerHTML = stat(d.done || 0, "indexed") + stat(d.pending || 0, "waiting") + stat(d.error || 0, "failed") +
    stat(d.duplicate || 0, "duplicates") + stat(d.unsupported || 0, "unsupported") + stat(c.superseded, "superseded") +
    stat(c.pages, "pages") + stat(c.ocr_pages, "scanned pages") + stat(c.low_conf_pages, "hard to read");
  const m = s.models, row = (label, x, need) => "<tr><td>" + label + "</td><td>" + (x.ok ? "Installed" : "Missing") + "</td><td>" + esc(x.name || "") + '</td><td class="muted">' + esc(x.ok ? "" : need) + "</td></tr>";
  $("modeltable").innerHTML = "<tr><th>Model</th><th>Status</th><th>Name</th><th></th></tr>" +
    row("Embedding (meaning search)", m.embedder, "Only keyword search works until this is installed.") +
    row("Reranker (relevance check)", m.reranker, "Relevance is judged by keyword overlap until this is installed.") +
    row("Answer model", m.generator, "Passages are shown without a written answer until this is installed.") +
    row("Answer checker (optional)", m.checker, "Extra model that re-checks written answers. The built-in quote and figure checks run regardless.");
  const dl = m.download;
  $("dlbtn").disabled = dl.running;
  $("dlline").textContent = dl.error ? "Failed — " + dl.error : dl.running ? "Downloading " + dl.step + (dl.total ? " " + Math.round(100 * dl.done / dl.total) + "%" : "…") : dl.step === "finished" ? "Finished." : "";
  $("homeline").textContent = "Data folder: " + s.home + " · version " + s.version;
}
setInterval(refresh, 2000); refresh();

// ---------------------------------------------------------------- library
if (window.pywebview || navigator.userAgent.includes("pywebview")) $("pickbtn").hidden = false;
window.addEventListener("pywebviewready", () => { $("pickbtn").hidden = false; });
$("pickbtn").onclick = async () => { const p = await window.pywebview.api.pick_folder(); if (p) $("folderpath").value = p; };
$("addfolder").onclick = async () => {
  try { await api("/api/folders", { path: $("folderpath").value.trim() }); $("folderpath").value = ""; refresh(); }
  catch (err) { alert(err.message); }
};
$("folders").onclick = async (e) => {
  const p = e.target.dataset.rm;
  if (p && confirm("Remove this folder and its documents from the index? The files themselves are not touched.")) { await api("/api/folders/remove", { path: p }); refresh(); loadDocs(); }
};
const act = (id, path) => $(id).onclick = async () => { try { await api(path, {}); } catch (err) { alert(err.message); } refresh(); };
act("startbtn", "/api/ingest/start"); act("stopbtn", "/api/ingest/stop"); act("retrybtn", "/api/ingest/retry-errors"); act("dlbtn", "/api/models/download");

const STATE = { done: "Indexed", pending: "Waiting", error: "Failed", duplicate: "Duplicate", unsupported: "Unsupported type", missing: "File missing" };
async function loadDocs() {
  const r = await api("/api/documents?limit=200&q=" + encodeURIComponent($("docq").value) + "&state=" + encodeURIComponent($("docstate").value));
  $("doctable").innerHTML = "<tr><th>File</th><th>Type</th><th>Number</th><th>Date</th><th>Pages</th><th>State</th><th></th></tr>" + r.items.map((d) => {
    const sup = d.state === "done" && d.status === "superseded";
    const scan = d.ocr_pages ? " (" + d.ocr_pages + " scanned, " + Math.round((d.mean_conf || 0) * 100) + "%)" : "";
    return "<tr><td>" + esc(d.file) + (d.title && d.title !== d.file ? '<div class="muted">' + esc(d.title) + "</div>" : "") + (d.error ? '<div class="notice">' + esc(d.error) + "</div>" : "") + "</td><td>" + esc(d.doc_type || "") + "</td><td>" + esc(d.doc_number || "") + "</td><td>" + esc(d.issue_date || "") + "</td><td>" + (d.n_pages || "") + scan + "</td><td>" +
      (sup ? '<span class="badge bad">Superseded</span>' : esc(STATE[d.state] || d.state)) + "</td><td>" +
      (d.state === "done" ? '<button class="btn small" data-id="' + d.id + '" data-to="' + (sup ? "active" : "superseded") + '">' + (sup ? "Mark current" : "Mark superseded") + "</button>" : "") + "</td></tr>";
  }).join("");
  $("docmore").textContent = r.total > r.items.length ? "Showing " + r.items.length + " of " + r.total + ". Use the filter to narrow down." : r.total + " files";
}
$("docq").oninput = () => { clearTimeout(window._dq); window._dq = setTimeout(loadDocs, 250); };
$("docstate").onchange = loadDocs;
$("doctable").onclick = async (e) => { const b = e.target.closest("button"); if (b) { await api("/api/documents/" + b.dataset.id + "/status", { status: b.dataset.to }); loadDocs(); refresh(); } };
async function loadReview() {
  const rows = await api("/api/review");
  $("reviewtable").innerHTML = rows.length ? "<tr><th>File</th><th>Page</th><th>Read confidence</th></tr>" + rows.map((r) => "<tr><td>" + esc(r.file) + "</td><td>" + r.page_no + "</td><td>" + Math.round(r.conf * 100) + "%</td></tr>").join("") : '<tr><td class="muted">Nothing to review.</td></tr>';
}

// ---------------------------------------------------------------- settings
const FIELDS = [
  ["min_score", "Refusal threshold", "number", "Passages scoring below this are treated as not relevant. Raise it if the app answers from unrelated text; lower it if it refuses too often."],
  ["final_k", "Passages per answer", "number", "How many passages are shown and given to the answer model."],
  ["ocr_low_conf", "Hard-to-read cut-off", "number", "Scanned text read with confidence below this gets a warning."],
  ["ocr_dpi", "Scan reading resolution (DPI)", "number", "Higher reads small print better but is slower. Applies to documents read from now on."],
  ["include_superseded", "Search superseded documents by default", "checkbox", ""],
  ["date_order", "Order of dates like 03/04/2023", "text", "DMY (day first) or MDY (month first)."],
  ["embed_model", "Embedding model", "text", "Changing this re-indexes every passage."],
  ["rerank_model", "Reranker model", "text", ""],
  ["llm_file", "Answer model file", "text", "A .gguf file name in the models folder. Empty uses the first one found."],
];
async function loadSettings() {
  const s = await api("/api/settings");
  $("settingsform").innerHTML = FIELDS.map(([k, label, type, help]) =>
    '<div class="field"><label for="s_' + k + '">' + label + "</label>" +
    (type === "checkbox" ? '<input type="checkbox" id="s_' + k + '"' + (s[k] ? " checked" : "") + ' style="justify-self:start">' : '<input type="' + type + '" step="any" id="s_' + k + '" value="' + esc(s[k]) + '">') +
    (help ? "<small>" + help + "</small>" : "") + "</div>").join("");
}
$("savebtn").onclick = async () => {
  const body = {};
  for (const [k, , type] of FIELDS) { const el = $("s_" + k); body[k] = type === "checkbox" ? el.checked : type === "number" ? Number(el.value) : el.value; }
  try { await api("/api/settings", body); $("saveline").textContent = "Saved."; } catch (err) { $("saveline").textContent = err.message; }
  refresh();
};
</script>
</body>
</html>
